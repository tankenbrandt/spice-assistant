circuit: lab_clipper
description: >
  EE 346 Exp. 4, Figure 1. Double diode clipper: 5 V, 1 kHz sine through
  15k, clipped at +(V1 + Vd) and -(V2 + Vd) with V1 = V2 = 1.5 V. A 1N4001
  at the ~0.2 mA this circuit allows drops about 0.5 V, so the output should
  top out near +/-2.0 V -- not +/-1.5 V (ideal diodes) and not +/-5 V (not
  clipping at all).

analyses:
  tran:
    command: tran 5u 5m
    vectors: [v(in), v(out)]

measurements:
  - name: vin_peak
    label: input peak
    units: V
    extract: {kind: max, of: v(in)}
    target: 5
    tol: 2%

  # 1.7..2.4, not 1.9..2.3: at 0.2 mA a 1N4001's drop depends on which
  # model (or which part) you have -- N = 2.0 gives 0.49 V, N = 1.45 gives
  # 0.36 V -- and a correctly wired clipper with the latter measured 1.86 V.
  # The band still rejects every wrong circuit: no batteries (0.5 V), a
  # reversed diode (~ -1 V), no clipping at all (5 V).
  - name: vmax
    label: positive clip
    units: V
    extract: {kind: max, of: v(out), window: last 50%}
    min: 1.7
    max: 2.4

  - name: vmin
    label: negative clip
    units: V
    extract: {kind: min, of: v(out), window: last 50%}
    min: -2.4
    max: -1.7
