circuit: lab_bridge
description: >
  EE 346 Exp. 4, Figure 4. Full-wave bridge, 10 V peak at 60 Hz, 2.2k load
  across the bridge. The load floats, so the output is measured
  differentially. The lab's check is Vdc ~ 2Vp/pi = 6.37 V (ideal diodes).
  Two real diodes are in the path each half-cycle, so with 2Vd = 1.3 V the
  same exact average as the half-wave spec, doubled, gives 5.12 V.

analyses:
  tran:
    command: tran 10u 100m
    vectors: ["v(outp,outn)"]    # vo across the floating load (quoted: YAML splits on the comma)

measurements:
  - name: vdc
    label: Vdc
    units: V
    extract: {kind: mean, window: last 50%}
    target: 5.12
    tol: 5%

  - name: vmin
    label: min vo
    units: V
    extract: {kind: min}
    min: -0.05
