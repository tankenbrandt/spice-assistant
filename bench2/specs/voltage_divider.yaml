circuit: voltage_divider
description: Resistive divider, 3.3 V from a regulated 12 V rail (+/-2%)

analyses:
  op:
    command: op
    vectors: [v(out)]

measurements:
  - name: vout
    label: V(out)
    units: V
    extract: {kind: mean, of: v(out)}   # a single operating point
    target: 3.3
    tol: 2%
