[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "spice-assistant"
version = "0.1.0"
description = "Natural language to ngspice netlist, with spec verification and Monte Carlo signoff"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Thomas Ankenbrandt" }]
dependencies = ["anthropic", "pyyaml"]

# The verification layers need no API key, so `anthropic` is only actually
# required by main.py and benchmark.py.

[project.scripts]
spice-assistant  = "main:main"              # natural language -> netlist
spice-speccheck  = "speccheck:_cli"         # does a deck meet its spec?
spice-robustness = "robustness:_cli"        # Monte Carlo / sensitivity signoff
spice-plot       = "plot:_cli"              # waveforms with the spec band on them
spice-netlist    = "netlist:_cli"           # .asc schematic -> deck
ascview          = "ascview:main"           # render a .asc without LTspice
spice-symlib     = "symlib:_cli"            # inspect LTspice's .asy library
spice-crosscheck = "crosscheck:_cli"        # same spec, ngspice vs LTspice
spice-ascgen     = "ascgen:_cli"            # deck -> .asc schematic
spice-tolerances = "tolerances:_cli"        # sourced component tolerances
spice-op         = "oppoint:_cli"           # every node voltage and branch current
spice-report     = "report:_cli"            # one circuit, every layer, one report
spice-design     = "design:_cli"            # generate/repair until the spec passes
spice-kit        = "kit:_cli"               # pick real parts from a lab kit
spice-labreport  = "labreport:_cli"         # simulate / design / test-plan pre-lab

[tool.setuptools]
# A flat layout of single-purpose CLIs, so the modules are listed rather than
# discovered -- that keeps tests/ and the report scripts out of the wheel.
py-modules = ["main", "speccheck", "specs", "robustness", "benchmark",
              "robustness_study", "ascview", "plot", "netlist", "symlib",
              "ltspice", "crosscheck", "ascgen", "tolerances", "oppoint",
              "report", "design", "kit", "labreport"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.5"]
labreport = ["python-docx", "matplotlib"]   # the .docx and figures labreport.py writes

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
  "slow: end-to-end runs that invoke ngspice repeatedly",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# F: real errors (undefined names, unused imports, redefinitions -- the class
# that caught a display formatter shadowing the netlist formatter).
# E9: syntax. B: likely bugs. UP: modern-Python idioms.
select = ["F", "E9", "B", "UP"]
