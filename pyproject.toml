[project]
name = "spice-assistant"
version = "0.1.0"
description = "Natural language to ngspice netlist, with spec verification and Monte Carlo signoff"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Thomas Ankenbrandt" }]
dependencies = ["anthropic", "pyyaml"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
  "slow: end-to-end runs that invoke ngspice repeatedly",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# F: real errors (undefined names, unused imports, redefinitions -- the class
# that caught a display formatter shadowing the netlist formatter).
# E9: syntax. B: likely bugs. UP: modern-Python idioms.
select = ["F", "E9", "B", "UP"]
